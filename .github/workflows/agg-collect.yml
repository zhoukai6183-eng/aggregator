name: Agg Collect
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

concurrency:
  group: agg-collect
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - name: Install
        run: pip3 install -r requirements.txt
      - name: Collect
        run: python -u subscribe/collect.py --all --overwrite --skip || true
      - name: Timestamp
        run: date
