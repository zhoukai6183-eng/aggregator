name: Agg Refresh
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: agg-refresh
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - name: Install
        run: pip3 install -r requirements.txt
      - name: Refresh
        run: python -u subscribe/collect.py --all --refresh --overwrite --skip || true
      - name: Timestamp
        run: date
